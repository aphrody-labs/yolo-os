[package]
name = "bun_native"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Host hardware topology (CPU, RAM, CUDA) and monotonic clock probes."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The CUDA driver is loaded at run time so the crate builds and runs on hosts without CUDA.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
