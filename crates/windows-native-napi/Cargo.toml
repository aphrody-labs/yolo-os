# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-windows-napi"
version = "1.4.7"
edition = "2024"
authors = ["YOLO OS Contributors"]
repository = "https://github.com/yolo-rs/yolo-os"
license = "Apache-2.0"
description = "Windows Runtime APIs exposed to Bun through a Node-API addon backed by windows-rs."
publish = false

[lib]
name = "yolo_windows_napi"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.15", default-features = false, features = ["napi8"] }
napi-derive = "3.6"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Storage",
  "Storage_Search",
  "System_Profile",
  "Win32_System_WinRT",
] }

[build-dependencies]
napi-build = "2"

