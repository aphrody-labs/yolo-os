[package]
name = "yolo-disk"
version = "0.1.0"
edition = "2024"
authors = ["Antigravity & YOLO Protocol"]
description = "High-performance Win32 NTFS & NVMe SSD optimization engine"

[dependencies]
windows = { version = "0.60.0", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_SystemServices",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
