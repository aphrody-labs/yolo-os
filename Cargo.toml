[workspace]
resolver = "2"
members = ["crates/cargo-lfs", "crates/bun-os-native", "crates/windows-native-napi"]
default-members = ["crates/cargo-lfs", "crates/bun-os-native", "crates/windows-native-napi"]

[workspace.package]
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"
